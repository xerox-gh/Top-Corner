function toHex(color){const c=document.createElement('canvas').getContext('2d');c.fillStyle=color;const s=c.fillStyle;if(s[0]==='#')return s;const a=s.match(/[\d.]+/g);return '#'+a.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('')}
// Round-robin scheduling: rotating ring, mirrored second half for career seasons.
const LeagueEngine={fixtures(ids,double=false){let ring=[...ids];if(ring.length%2)ring.push(null);const rounds=[];for(let r=0;r<ring.length-1;r++){const pairs=[];for(let i=0;i<ring.length/2;i++){let a=ring[i],b=ring[ring.length-1-i];if(a!==null&&b!==null)pairs.push(r%2?[b,a]:[a,b])}rounds.push(pairs);ring.splice(1,0,ring.pop())}return double?[...rounds,...rounds.map(r=>r.map(([a,b])=>[b,a]))]:rounds},table(ids){return ids.map(id=>({id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}))},record(table,a,b,x,y){const h=table.find(t=>t.id===a),v=table.find(t=>t.id===b);if(!h||!v)throw Error('Fixture missing from table');h.p++;v.p++;h.gf+=x;h.ga+=y;v.gf+=y;v.ga+=x;if(x>y){h.w++;v.l++;h.pts+=3}else if(x<y){v.w++;h.l++;v.pts+=3}else{h.d++;v.d++;h.pts++;v.pts++}},sorted(table){return [...table].sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.id-b.id)},simulate(a,b,seed){const r=rng(seed),diff=(WorldDatabase.club(a).rep-WorldDatabase.club(b).rep)/30;function poisson(l){let k=0,p=1;do{k++;p*=r()}while(p>Math.exp(-l));return k-1}return [poisson(clamp(1.55+diff,.25,3.8)),poisson(clamp(1.15-diff,.2,3.5))]},tableHTML(table,you){return `<div class="tablewrap"><table><thead><tr><th>#</th><th>CLUB</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>PTS</th></tr></thead><tbody>${this.sorted(table).map((t,i)=>`<tr class="${t.id===you?'you':''}"><td>${i+1}</td><td>${esc(WorldDatabase.club(t.id).name)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`).join('')}</tbody></table></div>`},createTournament(){const ids=[...document.querySelectorAll('.tclub:checked')].map(e=>+e.value);if(ids.length!==8)return toast('Select exactly 8 clubs.');tournament={version:1,type:'tournament',name:$('tName').value.trim()||'Top Corner Cup',format:$('tFormat').value,ids,round:0,fixtures:[],table:this.table(ids),results:[],done:false};tournament.fixtures=tournament.format==='league'?this.fixtures(ids):[[...ids].reduce((a,v,i)=>{if(i%2===
